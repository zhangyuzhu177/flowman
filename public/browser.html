<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Flowman 调试浏览器</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f7fb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", sans-serif; }
    header { height: 52px; display: flex; gap: 8px; align-items: center; padding: 0 12px; background: #fff; border-bottom: 1px solid #d7dfeb; }
    input { flex: 1; height: 32px; border: 1px solid #c9d3e2; border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none; }
    input:focus { border-color: #0a64d8; box-shadow: 0 0 0 2px rgba(10, 100, 216, 0.15); }
    button { height: 32px; border: 0; border-radius: 8px; background: #0a64d8; color: white; padding: 0 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
    button:hover { background: #0957bc; }
    p { margin: 0; color: #667386; font-size: 12px; }
    webview { height: calc(100% - 52px); width: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <input id="url" />
    <button id="go" type="button">打开</button>
    <p>仅此窗口走代理，并接受调试证书</p>
  </header>
  <webview id="view" partition="persist:flowman-debug" allowpopups></webview>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById("url");
    const view = document.getElementById("view");
    input.value = params.get("url") || "http://127.0.0.1:9108/";
    const go = () => { view.src = input.value; };
    document.getElementById("go").onclick = go;
    input.addEventListener("keydown", (event) => { if (event.key === "Enter") go(); });
    go();
  </script>
</body>
</html>
